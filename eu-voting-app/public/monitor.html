<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EU-Parlamentet - Röstmonitor</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="monitor-page">
  <!-- Top banner -->
  <div class="monitor-header">
    <div class="monitor-header-left">
      <svg viewBox="0 0 810 540" width="50" class="monitor-flag">
        <rect fill="#003399" width="810" height="540"/>
        <g fill="#FFCC00" transform="translate(405,270)">
          <g id="s12"><g id="s6"><g id="s2"><path id="s" d="M0,-100 L23.5,-30.9 97.6,-30.9 38,-18.2 58.8,50.9 0,-2 -58.8,50.9 -38,-18.2 -97.6,-30.9 -23.5,-30.9z" transform="scale(0.3)"/><use href="#s" transform="rotate(60)"/></g><use href="#s2" transform="rotate(120)"/></g><use href="#s6" transform="rotate(180)"/></g>
        </g>
      </svg>
      <div>
        <h1>EUROPAPARLAMENTET</h1>
        <p class="monitor-subtitle">OMRÖSTNING</p>
      </div>
    </div>
    <div class="monitor-header-right">
      <div class="monitor-clock" id="monitor-clock"></div>
    </div>
  </div>

  <!-- Topic bar -->
  <div class="monitor-topic-bar">
    <div id="monitor-topic" class="monitor-topic">Väntar på omröstning...</div>
    <div id="monitor-status-badge" class="monitor-status-badge status-waiting">VÄNTAR</div>
  </div>

  <!-- Main content -->
  <div class="monitor-body">
    <!-- Hemicycle -->
    <div class="hemicycle-container">
      <svg id="hemicycle" viewBox="0 0 800 450" class="hemicycle-svg"></svg>
    </div>

    <!-- Vote totals panel -->
    <div class="vote-totals-panel" id="vote-totals">
      <div class="total-box total-ja">
        <div class="total-label">JA</div>
        <div class="total-number" id="total-ja">0</div>
      </div>
      <div class="total-box total-nej">
        <div class="total-label">NEJ</div>
        <div class="total-number" id="total-nej">0</div>
      </div>
      <div class="total-box total-avstar">
        <div class="total-label">AVSTÅR</div>
        <div class="total-number" id="total-avstar">0</div>
      </div>
      <div class="total-box total-notvoted">
        <div class="total-label">EJ RÖSTAT</div>
        <div class="total-number" id="total-notvoted">0</div>
      </div>
    </div>

    <!-- Result overlay (shown when voting closes) -->
    <div id="result-overlay" class="result-overlay hidden">
      <div class="result-overlay-content">
        <div id="result-verdict-big" class="result-verdict-big"></div>
        <div class="result-overlay-bars">
          <div class="ro-bar-row">
            <span class="ro-label">JA</span>
            <div class="ro-bar"><div class="ro-fill bar-ja" id="ro-ja"></div></div>
            <span class="ro-num" id="ro-ja-num">0</span>
          </div>
          <div class="ro-bar-row">
            <span class="ro-label">NEJ</span>
            <div class="ro-bar"><div class="ro-fill bar-nej" id="ro-nej"></div></div>
            <span class="ro-num" id="ro-nej-num">0</span>
          </div>
          <div class="ro-bar-row">
            <span class="ro-label">AVSTÅR</span>
            <div class="ro-bar"><div class="ro-fill bar-avstar" id="ro-avstar"></div></div>
            <span class="ro-num" id="ro-avstar-num">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Group breakdown (bottom) -->
    <div class="group-breakdown" id="group-breakdown"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/monitor.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EU-Parlamentet - Röstning</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="student-page">
  <div class="eu-header">
    <div class="eu-flag-icon">
      <svg viewBox="0 0 810 540" width="60">
        <rect fill="#003399" width="810" height="540"/>
        <g fill="#FFCC00" transform="translate(405,270)">
          <g id="s12"><g id="s6"><g id="s2"><path id="s" d="M0,-100 L23.5,-30.9 97.6,-30.9 38,-18.2 58.8,50.9 0,-2 -58.8,50.9 -38,-18.2 -97.6,-30.9 -23.5,-30.9z" transform="scale(0.3)"/><use href="#s" transform="rotate(60)"/></g><use href="#s2" transform="rotate(120)"/></g><use href="#s6" transform="rotate(180)"/></g>
        </g>
      </svg>
    </div>
    <h1>Europaparlamentet</h1>
    <p class="subtitle">Omröstningssystem</p>
  </div>

  <!-- Login screen -->
  <div id="login-screen" class="card">
    <h2>Logga in som ledamot</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="seat-number">Platsnummer (1-40)</label>
        <input type="number" id="seat-number" min="1" max="40" required placeholder="Ditt platsnummer">
      </div>
      <div class="form-group">
        <label for="student-name">Namn</label>
        <input type="text" id="student-name" required placeholder="Ditt namn">
      </div>
      <div class="form-group">
        <label for="country-select">Land</label>
        <select id="country-select" required>
          <option value="">Välj land...</option>
        </select>
      </div>
      <div class="form-group">
        <label for="group-select">Politisk grupp</label>
        <select id="group-select" required>
          <option value="">Välj grupp...</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-large">Logga in</button>
    </form>
    <div id="login-error" class="error-msg hidden"></div>
  </div>

  <!-- Voting screen -->
  <div id="voting-screen" class="hidden">
    <div class="member-badge" id="member-badge">
      <span class="badge-group" id="badge-group"></span>
      <span class="badge-name" id="badge-name"></span>
      <span class="badge-country" id="badge-country"></span>
      <span class="badge-seat">Plats <span id="badge-seat"></span></span>
    </div>

    <div id="waiting-card" class="card">
      <div class="waiting-icon">
        <div class="eu-stars-spinner"></div>
      </div>
      <h2>Väntar på omröstning...</h2>
      <p>Ordföranden har ännu inte öppnat omröstningen.</p>
    </div>

    <div id="vote-card" class="card hidden">
      <h2 class="vote-topic" id="vote-topic"></h2>
      <p class="vote-instruction">Avge din röst:</p>
      <div class="vote-buttons">
        <button class="vote-btn vote-ja" data-vote="JA">
          <span class="vote-icon">+</span>
          <span>JA</span>
        </button>
        <button class="vote-btn vote-nej" data-vote="NEJ">
          <span class="vote-icon">&minus;</span>
          <span>NEJ</span>
        </button>
        <button class="vote-btn vote-avstar" data-vote="AVSTÅR">
          <span class="vote-icon">0</span>
          <span>AVSTÅR</span>
        </button>
      </div>
      <div id="vote-status" class="vote-status hidden"></div>
    </div>

    <div id="result-card" class="card hidden">
      <h2>Omröstningen är avslutad</h2>
      <div id="result-summary"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/vote.js"></script>
</body>
</html>
